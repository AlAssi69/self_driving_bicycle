# Fast checks before each commit: `pre-commit install`, or `pre-commit run --all-files`.
# The ROS lint suite (ament_flake8, ament_pep257, ament_xmllint, ...) runs with `colcon test`.
exclude: ^bicycle_navigation/maps/.*\.(posegraph|data|pgm)$

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
      - id: check-xml
        types: [text]
        files: \.(xml|xacro|urdf|sdf|config)$
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-executables-have-shebangs
      - id: check-merge-conflict

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
      - id: ruff-format

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.35.1
    hooks:
      - id: yamllint

  - repo: https://github.com/codespell-project/codespell
    rev: v2.3.0
    hooks:
      - id: codespell
        args: [--skip, "*.dae,*.png"]
