# Single source of truth for the bicycle's physical parameters (SI units).
#
# Read by urdf/bicycle.urdf.xacro through xacro.load_yaml(). A few values have to be
# repeated in other packages' YAML files (controller, Nav2) because those are plain
# ROS parameter files; bicycle_bringup/test/test_consistency.py checks every copy
# against this file.

wheelbase: 0.98            # rear axle -> front axle [m]

wheel:
  radius: 0.25             # [m]
  width: 0.20              # wide wheels keep the bicycle statically upright [m]
  mass: 1.0                # [kg]
  friction: 1.0            # Coulomb friction coefficient (both directions)

chassis:
  tube_radius: 0.01        # frame tube between the axles [m]
  mass: 1.5                # [kg]

steering:
  fork_size: 0.05          # edge of the cubic steering fork [m]
  fork_mass: 0.2           # [kg]
  max_angle: 0.7854        # |steering angle| limit [rad] (45 deg)
  max_velocity: 2.0        # [rad/s]
  max_effort: 10.0         # [N m]

traction:
  max_velocity: 2.0        # rear wheel speed limit [rad/s] (= 0.5 m/s)
  max_effort: 10.0         # [N m]

# YDLIDAR X4 Pro (bicycle_hardware/config/ydlidar.yaml): 5 kHz sampling at 10 Hz.
lidar:
  radius: 0.05             # sensor puck [m]
  length: 0.04             # sensor puck [m]
  mass: 0.2                # sensor + mast [kg]
  mast_radius: 0.01        # [m]
  scan_height: 0.65        # scan plane above the ground; must clear the wheel tops [m]
  update_rate: 10.0        # [Hz]
  samples: 500             # per revolution
  min_range: 0.10          # [m]
  max_range: 12.0          # [m]
